# Checks that run on every push: nothing secret leaks into a public repo, and nothing
# in the case studies points at a file that is not there.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # scan the whole history, not only the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Offline: only relative links between files of this repo are checked. External
      # links are left alone so a slow third-party site cannot turn the build red.
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md' 'docs/**/*.html'
          fail: true

  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Every Russian case study must have an English twin with the same headings,
      # diagrams, code blocks and table rows - so an edit to one language cannot quietly
      # leave the other behind.
      - name: Structure matches between RU and EN
        run: |
          status=0
          for f in cases/*.md; do
            python tools/check_translation.py "$f" "cases/en/$(basename "$f")" || status=1
          done
          python tools/check_translation.py README.md README.en.md || status=1
          exit $status

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: HTML validity
        run: npx --yes html-validate@9 docs/index.html
      - name: JavaScript parses
        run: node --check docs/assets/app.js
